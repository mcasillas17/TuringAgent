name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run Go race tests
        run: go test -tags sqlite_fts5 -race ./... -count=1

      - name: Run Go vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Build Go packages
        run: go build -tags sqlite_fts5 ./...

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: |
            go.sum
            turing-backend/mcp-files/go.sum
            turing-backend/mcp-system/go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint root module
        working-directory: .
        run: golangci-lint run ./...

      - name: Lint MCP files module
        working-directory: turing-backend/mcp-files
        run: golangci-lint run ./...

      - name: Lint MCP system module
        working-directory: turing-backend/mcp-system
        run: golangci-lint run ./...

  mcp-files:
    name: MCP files module
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: |
            go.sum
            turing-backend/mcp-files/go.sum

      - name: Race test MCP files module
        run: |
          cd turing-backend/mcp-files
          go test -race ./... -count=1

      - name: Vet MCP files module
        run: |
          cd turing-backend/mcp-files
          go vet ./...

      - name: Build MCP files server
        run: |
          cd turing-backend/mcp-files
          go build ./cmd/server

  mcp-system:
    name: MCP system module
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          # mcp-system is stdlib-only and has no go.sum of its own, so the root
          # go.sum is the only real cache key available here.
          cache-dependency-path: go.sum

      - name: Race test MCP system module
        run: |
          cd turing-backend/mcp-system
          go test -race ./... -count=1

      - name: Vet MCP system module
        run: |
          cd turing-backend/mcp-system
          go vet ./...

      - name: Build MCP system server
        run: |
          cd turing-backend/mcp-system
          go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Deliberately ahead of the 1.23.x the other jobs pin: golangci-lint
          # v2.12.2's own go.mod requires go >= 1.25.0, so a 1.23 toolchain can
          # only build it by silently auto-switching via GOTOOLCHAIN=auto. Pin
          # the version that actually builds the linter instead of depending on
          # that default. The language level of the analyzed code is unaffected —
          # it stays capped by each module's own `go 1.23` directive.
          go-version: "1.25.x"
          cache: true
          # mcp-system is stdlib-only and has no go.sum, so it contributes no key.
          cache-dependency-path: |
            go.sum
            turing-backend/mcp-files/go.sum

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # --config is passed explicitly rather than relying on the upward search:
      # if that search ever missed, golangci-lint would silently fall back to its
      # own defaults and this job would stop checking what the repo configured.
      # The root module is linted with the same build tag it is built with, so
      # the analysis sees exactly the code that ships.
      #
      # ./.github/workflows is listed separately because Go's `./...` pattern
      # skips directories starting with `.` — the same reason the workflow
      # coverage test needs its own `go test ./.github/workflows` step below.
      # Without it, ci_test.go (the file guarding every check in this workflow)
      # would be the one root-module package that is compiled and tested but
      # never linted.
      - name: Lint root module
        run: golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" --build-tags sqlite_fts5 ./... ./.github/workflows

      - name: Lint MCP files module
        run: |
          cd turing-backend/mcp-files
          golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...

      - name: Lint MCP system module
        run: |
          cd turing-backend/mcp-system
          golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...

  proto-and-scripts:
    name: Proto and script checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "34.1"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Go protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Dart protobuf plugin
        run: |
          dart pub global activate protoc_plugin 22.5.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Check generated protobuf output
        run: tools/proto/check.sh

      - name: Check shell scripts
        run: bash -n turing-backend/scripts/compose.sh turing-backend/scripts/dev.sh turing-backend/scripts/init.sh turing-backend/scripts/reset.sh turing-backend/scripts/rotate-client-key.sh turing-backend/scripts/smoke-grpc.sh turing-backend/scripts/smoke.sh

      - name: Check workflow coverage
        run: go test -tags sqlite_fts5 ./.github/workflows

  flutter:
    name: Flutter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turing-client/turing_app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
