services:
  turing-orchestrator:
    # The in-process reconnect loop covers stream failures; this covers what it
    # cannot: a panic, an OOM kill, or a fatal config error at startup.
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: turing-backend/orchestrator-go/Dockerfile
      args:
        GOFLAGS: -tags=sqlite_fts5
    user: "${HOST_UID:?Use scripts/compose.sh to launch}:${HOST_GID:?Use scripts/compose.sh to launch}"
    read_only: true
    tmpfs:
      - /dev/shm:ro,nosuid,nodev,noexec,size=64k
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TURING_CLIENT_API_KEY: ${TURING_CLIENT_API_KEY}
      TURING_INTERNAL_TOKEN: ${TURING_INTERNAL_TOKEN}
      MCP_SYSTEM_TOKEN_GENERAL: ${MCP_SYSTEM_TOKEN_GENERAL}
      MCP_FILES_TOKEN_GENERAL: ${MCP_FILES_TOKEN_GENERAL}
      TURING_APPROVAL_JWT_SECRET: ${TURING_APPROVAL_JWT_SECRET}
      # Seals third-party credentials before they reach the database. The
      # orchestrator is the only service that stores or opens one.
      TURING_INTEGRATION_KEY: ${TURING_INTEGRATION_KEY}
      ORCHESTRATOR_PUBLIC_PORT: ${ORCHESTRATOR_PUBLIC_PORT:-3000}
      ORCHESTRATOR_INTERNAL_PORT: ${ORCHESTRATOR_INTERNAL_PORT:-3001}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/turing.db}
      SKILLS_ROOT: /skills
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Parsed here for the names only: the orchestrator answers "can this
      # agent actually run?" for the client and never calls a vendor, so it
      # keeps the credential names and drops the keys.
      TURING_AGENT_API_KEYS: ${TURING_AGENT_API_KEYS:-}
      TURING_JOB_TIMEOUT_MS: ${TURING_JOB_TIMEOUT_MS:-300000}
      TURING_JOB_REAPER_INTERVAL_MS: ${TURING_JOB_REAPER_INTERVAL_MS:-60000}
      TURING_AUTOMATION_TICK_MS: ${TURING_AUTOMATION_TICK_MS:-30000}
      TURING_JOB_MAX_ATTEMPTS: ${TURING_JOB_MAX_ATTEMPTS:-3}
      TURING_MAX_CONCURRENT_RUNS_GENERAL: ${TURING_MAX_CONCURRENT_RUNS_GENERAL:-1}
      TURING_MAX_TOOL_CALLS_PER_RUN: ${TURING_MAX_TOOL_CALLS_PER_RUN:-10}
      TURING_MODEL_TIMEOUT_MS: ${TURING_MODEL_TIMEOUT_MS:-120000}
      TURING_TOOL_TIMEOUT_MS: ${TURING_TOOL_TIMEOUT_MS:-30000}
      TURING_APPROVAL_TIMEOUT_MS: ${TURING_APPROVAL_TIMEOUT_MS:-65000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PUBLIC_PORT:-3000}:3000"
    expose:
      - "3001"
    volumes:
      - ../data:/app/data
      - ../skills:/skills
    networks:
      - net-system
      - net-files

  turing-agent-runtime-general:
    # The in-process reconnect loop covers stream failures; this covers what it
    # cannot: a panic, an OOM kill, or a fatal config error at startup.
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: turing-backend/agent-runtime-go/Dockerfile
    user: "turing-agent-runtime:turing-agent-runtime"
    read_only: true
    tmpfs:
      - /dev/shm:ro,nosuid,nodev,noexec,size=64k
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TURING_INTERNAL_TOKEN: ${TURING_INTERNAL_TOKEN}
      ORCHESTRATOR_GRPC_ADDR: ${ORCHESTRATOR_GRPC_ADDR:-turing-orchestrator:3001}
      TURING_WORKER_ID: ${TURING_WORKER_ID:-worker-general-go}
      TURING_JOB_TIMEOUT_MS: ${TURING_JOB_TIMEOUT_MS:-300000}
      TURING_MAX_CONCURRENT_RUNS_GENERAL: ${TURING_MAX_CONCURRENT_RUNS_GENERAL:-1}
      TURING_MAX_TOOL_CALLS_PER_RUN: ${TURING_MAX_TOOL_CALLS_PER_RUN:-10}
      TURING_MODEL_TIMEOUT_MS: ${TURING_MODEL_TIMEOUT_MS:-120000}
      TURING_TOOL_TIMEOUT_MS: ${TURING_TOOL_TIMEOUT_MS:-30000}
      TURING_APPROVAL_TIMEOUT_MS: ${TURING_APPROVAL_TIMEOUT_MS:-65000}
      TURING_APPROVAL_WAIT_TIMEOUT_MS: ${TURING_APPROVAL_WAIT_TIMEOUT_MS:-71000}
      TURING_TOOL_TOTAL_TIMEOUT_MS: ${TURING_TOOL_TOTAL_TIMEOUT_MS:-180000}
      MCP_SYSTEM_BASE_URL: ${MCP_SYSTEM_BASE_URL:-http://turing-mcp-system:7100/mcp}
      MCP_FILES_BASE_URL: ${MCP_FILES_BASE_URL:-http://turing-mcp-files:7110/mcp}
      MCP_SYSTEM_TOKEN_GENERAL: ${MCP_SYSTEM_TOKEN_GENERAL}
      MCP_FILES_TOKEN_GENERAL: ${MCP_FILES_TOKEN_GENERAL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-2m}
      OLLAMA_CONTEXT_WINDOW_TOKENS: ${OLLAMA_CONTEXT_WINDOW_TOKENS:-32768}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-2048}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_CONTEXT_WINDOW_TOKENS: ${OPENAI_CONTEXT_WINDOW_TOKENS:-32768}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2048}
      # The only process that actually calls an external agent, and so the only
      # one that needs the keys themselves rather than just their names.
      TURING_AGENT_API_KEYS: ${TURING_AGENT_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      turing-orchestrator:
        condition: service_started
      turing-mcp-system:
        condition: service_healthy
      turing-mcp-files:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - net-system
      - net-files

  turing-mcp-system:
    # The in-process reconnect loop covers stream failures; this covers what it
    # cannot: a panic, an OOM kill, or a fatal config error at startup.
    restart: unless-stopped
    build: ../mcp-system
    user: "mcp-system:mcp-system"
    read_only: true
    tmpfs:
      - /dev/shm:ro,nosuid,nodev,noexec,size=64k
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MCP_SYSTEM_TOKEN_GENERAL: ${MCP_SYSTEM_TOKEN_GENERAL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
    expose:
      - "7100"
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    networks:
      - net-system

  turing-mcp-files:
    # The in-process reconnect loop covers stream failures; this covers what it
    # cannot: a panic, an OOM kill, or a fatal config error at startup.
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: turing-backend/mcp-files/Dockerfile
    user: "${HOST_UID:?Use scripts/compose.sh to launch}:${HOST_GID:?Use scripts/compose.sh to launch}"
    read_only: true
    tmpfs:
      - /dev/shm:ro,nosuid,nodev,noexec,size=64k
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MCP_FILES_TOKEN_GENERAL: ${MCP_FILES_TOKEN_GENERAL}
      TURING_APPROVAL_JWT_SECRET: ${TURING_APPROVAL_JWT_SECRET}
      TURING_INTERNAL_TOKEN: ${TURING_INTERNAL_TOKEN}
      ORCHESTRATOR_GRPC_ADDR: ${ORCHESTRATOR_GRPC_ADDR:-turing-orchestrator:3001}
      FILES_SANDBOX_ROOT: /sandbox
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
    expose:
      - "7110"
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    volumes:
      - ../sandbox:/sandbox
    networks:
      - net-files

networks:
  net-system:
  net-files:
