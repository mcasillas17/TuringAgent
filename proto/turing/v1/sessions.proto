syntax = "proto3";

package turing.v1;

option go_package = "github.com/mcasillas17/TuringAgent/gen/turing/v1/go;turingv1";

import "google/protobuf/timestamp.proto";
import "turing/v1/common.proto";

message Session {
  string session_id = 1;
  string title = 2;
  string status = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateSessionRequest {
  string title = 1;
}

message CreateSessionResponse {
  string session_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

enum SessionListFilter {
  SESSION_LIST_FILTER_UNSPECIFIED = 0;
  SESSION_LIST_FILTER_ACTIVE = 1;
  SESSION_LIST_FILTER_ARCHIVED = 2;
  SESSION_LIST_FILTER_ALL = 3;
}

message ListSessionsRequest {
  PageRequest page = 1;
  SessionListFilter filter = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  PageResponse page = 2;
}

message GetSessionRequest {
  string session_id = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

enum SessionDeletionState {
  SESSION_DELETION_STATE_UNSPECIFIED = 0;
  SESSION_DELETION_STATE_IN_PROGRESS = 1;
  SESSION_DELETION_STATE_FAILED_EXTERNAL = 2;
  SESSION_DELETION_STATE_COMPLETED = 3;
}

message SessionDeletionReceipt {
  string session_id = 1;
  SessionDeletionState state = 2;
  int64 lifecycle_version = 3;
  bool retryable = 4;
  string error_code = 5;
  int64 terminal_sequence = 6;
  int32 run_count = 7;
  int32 message_count = 8;
  int32 retained_legacy_artifact_count = 9;
}

message ListSessionDeletionReceiptsRequest {}

message ListSessionDeletionReceiptsResponse {
  repeated SessionDeletionReceipt deletions = 1;
}

message DeleteSessionResponse {
  string session_id = 1;
  SessionDeletionReceipt deletion = 2;
}

message RenameSessionRequest {
  string session_id = 1;
  string title = 2;
}

message RenameSessionResponse {
  Session session = 1;
}

message ArchiveSessionRequest {
  string session_id = 1;
}

message ArchiveSessionResponse {
  Session session = 1;
}

message RestoreSessionRequest {
  string session_id = 1;
}

message RestoreSessionResponse {
  Session session = 1;
}

message ListMessagesRequest {
  string session_id = 1;
  int32 limit = 2;
  string before_message_id = 3;
}

message ListMessagesResponse {
  repeated Message messages = 1;
}

// Selects one response representation so hit metadata does not duplicate
// unbounded message bodies.
enum SearchMessagesResponseFormat {
  // Resolves to LEGACY_MESSAGES for old callers.
  SEARCH_MESSAGES_RESPONSE_FORMAT_UNSPECIFIED = 0;
  // Returns only SearchMessagesResponse.messages.
  SEARCH_MESSAGES_RESPONSE_FORMAT_LEGACY_MESSAGES = 1;
  // Returns only SearchMessagesResponse.hits.
  SEARCH_MESSAGES_RESPONSE_FORMAT_HITS = 2;
}

message SearchHit {
  Message message = 1;

  // Finite and non-negative. Higher means a more relevant match within the
  // same SearchMessages response. Not comparable across queries or snapshots.
  double score = 2;

  // Bounded single-line plain text selected from message.content around the
  // match. Contains no server-added markup and must not be treated as HTML.
  string snippet = 3;
}

message SearchMessagesRequest {
  string query = 1;
  string session_id = 2; // optional scope; empty = all sessions
  int32 limit = 3;
  string exclude_session_id = 4; // optional exclusion; applied after session_id scope
  // Unsupported numeric values are rejected with InvalidArgument.
  SearchMessagesResponseFormat response_format = 5;
}

message SearchMessagesResponse {
  // Legacy compatibility field. New consumers request HITS.
  repeated Message messages = 1;
  repeated SearchHit hits = 2;
}

message GetConfigRequest {}

message GetConfigResponse {
  repeated ProviderConfig providers = 1;
  bool approvals_enabled = 2;
  bool files_mcp_enabled = 3;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentDescriptor agents = 1;
}

message ToolDescriptor {
  string server_name = 1;
  string tool_name = 2;
  ToolPolicy policy = 3;
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolDescriptor tools = 1;
}

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc ListSessionDeletionReceipts(ListSessionDeletionReceiptsRequest) returns (ListSessionDeletionReceiptsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc RenameSession(RenameSessionRequest) returns (RenameSessionResponse);
  rpc ArchiveSession(ArchiveSessionRequest) returns (ArchiveSessionResponse);
  rpc RestoreSession(RestoreSessionRequest) returns (RestoreSessionResponse);
}
