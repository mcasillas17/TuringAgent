syntax = "proto3";

package turing.v1;

option go_package = "github.com/mcasillas17/TuringAgent/gen/turing/v1/go;turingv1";

import "google/protobuf/struct.proto";
import "turing/v1/common.proto";
import "turing/v1/events.proto";
import "turing/v1/tools.proto";

// Where a run failure actually came from, supplied by the reporting call site
// so the orchestrator can normalize it into a public RunOutcomeReason without
// classifying on provider-controlled message text. UNSPECIFIED means the field
// was absent and UNKNOWN covers an origin a newer reporter introduced; both
// fail closed to an internal-failure outcome. Internal to the runtime protocol,
// never surfaced to clients.
enum FailureOrigin {
  FAILURE_ORIGIN_UNSPECIFIED = 0;
  FAILURE_ORIGIN_UNKNOWN = 1;
  FAILURE_ORIGIN_CONTEXT_ASSEMBLY = 2;
  FAILURE_ORIGIN_EXTERNAL_PROVIDER = 3;
  FAILURE_ORIGIN_PROVIDER_CONFIGURATION = 4;
  FAILURE_ORIGIN_PROVIDER_PROTOCOL = 5;
  FAILURE_ORIGIN_PROVIDER_TRANSPORT = 6;
  FAILURE_ORIGIN_PROVIDER_OUTPUT_GUARD = 7;
  FAILURE_ORIGIN_TOOL_INFRASTRUCTURE = 8;
  FAILURE_ORIGIN_TOOL_EXECUTION = 9;
  FAILURE_ORIGIN_TOOL_GUARD = 10;
  FAILURE_ORIGIN_TOOL_POLICY = 11;
  FAILURE_ORIGIN_APPROVAL_TRANSPORT = 12;
  FAILURE_ORIGIN_APPROVAL_EXPIRY = 13;
  FAILURE_ORIGIN_AUTOMATION_POLICY = 14;
  FAILURE_ORIGIN_WORKER_RUNTIME = 15;
  FAILURE_ORIGIN_DISPATCH = 16;
  FAILURE_ORIGIN_RECOVERY = 17;
  FAILURE_ORIGIN_ORCHESTRATOR_INTERNAL = 18;
  FAILURE_ORIGIN_CLIENT_LIFECYCLE = 19;
}

// Whether the orchestrator may retry this failure inside the same run. Internal
// dispatch policy only: it is not a user-facing retry promise and never becomes
// public outcome text. Unspecified and unknown are both treated as never, so an
// unrecognized class can never widen automatic retrying.
enum AutomaticRetryClass {
  AUTOMATIC_RETRY_CLASS_UNSPECIFIED = 0;
  AUTOMATIC_RETRY_CLASS_UNKNOWN = 1;
  AUTOMATIC_RETRY_CLASS_NEVER = 2;
  AUTOMATIC_RETRY_CLASS_SAME_RUN_TRANSIENT = 3;
}

message AgentJob {
  string job_id = 1;
  string run_id = 2;
  string session_id = 3;
  string user_message_id = 4;
  string assistant_message_id = 5;
  AgentId agent_id = 6;
  string trace_id = 7;
  ModelProvider model_provider = 8;
  string model = 9;
  string user_text = 10;
  repeated string requested_tools = 11;
  int32 attempt = 12;
  // The eligible filesystem skills when the message was accepted, captured
  // then rather than read at execution time so edits cannot rewrite a queued
  // run. Older queued jobs may still carry the legacy name/instructions pair.
  repeated SkillSnapshot skills = 13;
  // Set only when the conversation was deliberately routed away from the
  // local assistant. Absent is the default and means "run this here".
  ExternalAgentTarget external_agent = 14;
  int32 required_context_tokens = 15;
  int32 minimum_worker_max_concurrent_runs = 16;
  RunEgressDecision egress_decision = 17;
  // Exact tool names frozen by the orchestrator for this run. The runtime may
  // expose a subset after context budgeting, never tools outside this set.
  repeated string selected_tools = 18;
  // The run's state version at assignment. The worker echoes it on later
  // reports so the orchestrator can reject anything computed against a state it
  // has already moved past.
  int64 expected_state_version = 19;
  // Durable identity of this assignment attempt. It is what proves a later
  // report or resume came from the attempt that still owns the run, rather than
  // from a fenced predecessor; the worker must echo it unchanged.
  string assignment_attempt_id = 20;
}

// Where to send a run that the user routed off this machine.
//
// Deliberately not the full ExternalAgent message: the runtime has no use for
// identifiers, timestamps or the provider label, and this is replayed from a
// stored job payload where a narrower shape is a narrower thing to keep in
// sync. The model is not repeated here either — AgentJob.model already carries
// it, frozen at enqueue from the agent's configuration.
//
// credential_ref is a NAME, not a secret. The key it names is resolved from
// the runtime's own environment at execution time, so no third-party API key
// is ever written to the database, sent over this stream, or handed to a
// client.
message ExternalAgentTarget {
  string display_name = 1;
  string base_url = 2;
  string credential_ref = 3;
  string agent_id = 4;
}

// A frozen skill snapshot as the runtime sees it. instructions retains field 2
// for wire compatibility with jobs queued by the database-backed model; for
// filesystem skills it carries the SKILL.md body.
message SkillSnapshot {
  string name = 1;
  string instructions = 2;
  string skill_id = 3;
  string description = 4;
  string category = 5;
  map<string, string> references = 6;
  // True when this enabled skill was missing one or more declared grants when
  // the run was queued. Metadata remains visible in the enabled index, but
  // neither its body nor its references are present in the snapshot.
  bool withheld = 7;
  repeated string missing_capabilities = 8;
}

message DiscoveredTool {
  string server_name = 1;
  string tool_name = 2;
  google.protobuf.Struct schema = 3;
}

// A complete, authoritative snapshot for one runtime registration.
message WorkerCapabilities {
  repeated ModelCapability models = 1;
  repeated AgentId agent_ids = 2;
  repeated DiscoveredTool tools = 3;
  int32 max_concurrent_runs = 4;
  // Kept for older orchestrators. New routing decisions use the exact refs
  // below and never treat this coarse bit as authorization.
  bool supports_external_agents = 5;
  // Credential names only, never API keys. This complete set authorizes which
  // frozen external-agent destinations this worker can execute.
  repeated string external_agent_credential_refs = 6;
  // Highest run-egress decision version this worker enforces before provider
  // I/O. Zero means it predates explicit remote-egress enforcement.
  int32 remote_egress_decision_version = 7;
}

enum ToolDiscoveryStatus {
  // Legacy runtime that cannot report an authoritative capability snapshot.
  TOOL_DISCOVERY_STATUS_UNSPECIFIED = 0;
  // Discovery succeeded; tools is authoritative, including when it is empty.
  TOOL_DISCOVERY_STATUS_COMPLETE = 1;
  // Discovery was attempted but failed. The orchestrator rejects the worker.
  TOOL_DISCOVERY_STATUS_FAILED = 2;
}

message RuntimeWorkerReady {
  string worker_id = 1;
  AgentId agent_id = 2;
  int32 max_concurrent_runs = 3;
  // Complete snapshot of tools discovered by this worker.
  repeated DiscoveredTool tools = 4;
  ToolDiscoveryStatus tool_discovery_status = 5;
  // Unique to this stream. A reconnect for the same worker_id uses a fresh ID.
  string registration_id = 6;
  WorkerCapabilities capabilities = 7;
}

message RuntimeWorkerCapabilitiesUpdated {
  string worker_id = 1;
  string registration_id = 2;
  // Replaces the previous snapshot rather than patching it.
  WorkerCapabilities capabilities = 3;
}

message RuntimeHeartbeat {
  string worker_id = 1;
}

// Token counts a provider reported, summed over every model turn a run made.
//
// Both fields are optional and unset means UNKNOWN, never zero. Ollama reports
// prompt_eval_count/eval_count on its terminal chunk and an OpenAI-compatible
// provider reports a usage object; a provider that reports neither leaves this
// message absent entirely. Nothing anywhere estimates these — a token count
// nobody measured is worse than no token count, because someone will spend a
// decision on it.
message RunTokenUsage {
  optional int64 input_tokens = 1;
  optional int64 output_tokens = 2;
}

message RuntimeRunCompleted {
  string run_id = 1;
  string assistant_message_id = 2;
  string content = 3;
  // Free-form provider payload, echoed into the run-completed event. Kept as
  // it was rather than repurposed: token counts need presence semantics a
  // Struct cannot express without the reader guessing whether a missing key
  // means zero, so they travel in their own typed field below.
  google.protobuf.Struct usage = 4;
  RunTokenUsage token_usage = 5;
  // The state version this report was computed against; the terminal
  // transition commits only from that exact version.
  int64 expected_state_version = 6;
}

message RuntimeRunFailed {
  string run_id = 1;
  string code = 2;
  string message = 3;
  // Superseded by automatic_retry_class and ignored by the failure normalizer.
  // Retained at field 4 for wire compatibility with older workers.
  bool retryable = 4;
  // Where the failure came from, used to normalize a public outcome reason
  // instead of leaking worker-authored text to clients.
  FailureOrigin failure_origin = 5;
  // Whether the orchestrator may retry inside this run. Internal policy only.
  AutomaticRetryClass automatic_retry_class = 6;
  // The state version this report was computed against; the terminal
  // transition commits only from that exact version.
  int64 expected_state_version = 7;
}

message RuntimeCancelledAck {
  string run_id = 1;
  // The version the worker had actually observed when it acknowledged, which
  // lets the orchestrator tell a current acknowledgement from a stale one.
  int64 observed_state_version = 2;
}

// Sent only after the worker accepted an approval decision and restored the
// matching owned attempt to a ready-but-paused boundary. Run, approval, worker,
// assignment attempt, and expected version together are the fencing identity:
// a repeat of the exact same identity on the same live stream replays the same
// acceptance, and anything else is fenced.
message RuntimeApprovalResumeReady {
  string run_id = 1;
  string approval_id = 2;
  // The pre-transition version the worker expects; waiting-approval commits to
  // running at expected_state_version + 1.
  int64 expected_state_version = 3;
  string assignment_attempt_id = 4;
}

message RuntimeUpdate {
  oneof update {
    RuntimeWorkerReady worker_ready = 1;
    RuntimeHeartbeat heartbeat = 2;
    TuringEvent event = 3;
    ToolCallBeacon tool_beacon = 4;
    RuntimeRunCompleted run_completed = 5;
    RuntimeRunFailed run_failed = 6;
    RuntimeCancelledAck run_cancelled_ack = 7;
    RuntimeWorkerCapabilitiesUpdated worker_capabilities_updated = 8;
    RuntimeApprovalResumeReady approval_resume_ready = 9;
  }
}

message RuntimeWorkerAccepted {
  string worker_id = 1;
  string registration_id = 2;
}

message RuntimeRunCancelled {
  string run_id = 1;
  string reason = 2;
  // The version this cancellation committed at, so the worker never rolls its
  // view back to an older state.
  int64 state_version = 3;
}

message RuntimeApprovalUpdated {
  string approval_id = 1;
  string approval_token = 2;
  string status = 3;
  // The run version at the time of this decision. Delivering a decision does
  // not by itself resume the run; only a matching Ready/Accepted exchange does.
  int64 state_version = 4;
}

// The orchestrator's durable acceptance of a resume: waiting-approval has
// committed to running at state_version. It names the commit, not proof that
// the worker received it, and the worker must not execute the approved tool or
// continue model work until it arrives. If delivery fails after the commit, the
// run is fenced to recovering rather than reverted.
message RuntimeApprovalResumeAccepted {
  string run_id = 1;
  string approval_id = 2;
  int64 state_version = 3;
  string assignment_attempt_id = 4;
}

message RuntimeShutdownRequested {
  string reason = 1;
}

message RuntimeMcpRegistryChanged {
  string registration_id = 1;
}

message RuntimeCommand {
  oneof command {
    RuntimeWorkerAccepted worker_accepted = 1;
    AgentJob run_assigned = 2;
    RuntimeRunCancelled run_cancelled = 3;
    RuntimeApprovalUpdated approval_updated = 4;
    RuntimeShutdownRequested shutdown_requested = 5;
    ToolPolicyDecision tool_policy_decision = 6;
    RuntimeMcpRegistryChanged mcp_registry_changed = 7;
    RuntimeApprovalResumeAccepted approval_resume_accepted = 8;
  }
}

service RuntimeService {
  rpc ConnectWorker(stream RuntimeUpdate) returns (stream RuntimeCommand);
}
