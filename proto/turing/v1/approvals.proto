syntax = "proto3";

package turing.v1;

option go_package = "github.com/mcasillas17/TuringAgent/gen/turing/v1/go;turingv1";

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVAL_STATUS_PENDING = 1;
  APPROVAL_STATUS_APPROVED = 2;
  APPROVAL_STATUS_DENIED = 3;
  APPROVAL_STATUS_EXPIRED = 4;
  APPROVAL_STATUS_CONSUMED = 5;
}

message ApproveApprovalRequest {
  string approval_id = 1;
  // Optional by convention. Proto3 scalar presence is not enabled, so omission
  // and an explicitly empty value are both persisted as an empty human comment.
  string comment = 2;
}

message DenyApprovalRequest {
  string approval_id = 1;
  // Optional by convention. Proto3 scalar presence is not enabled, so omission
  // and an explicitly empty value are both persisted as an empty human reason.
  string reason = 2;
}

message ApprovalResponse {
  string approval_id = 1;
  ApprovalStatus status = 2;
}

message GetApprovalForRuntimeRequest {
  string approval_id = 1;
}

message RuntimeApprovalState {
  string approval_id = 1;
  ApprovalStatus status = 2;
  string approval_token = 3;
}

message ConsumeApprovalRequest {
  string approval_id = 1;
}

service ApprovalService {
  rpc ApproveApproval(ApproveApprovalRequest) returns (ApprovalResponse);
  rpc DenyApproval(DenyApprovalRequest) returns (ApprovalResponse);
  rpc GetApprovalForRuntime(GetApprovalForRuntimeRequest) returns (RuntimeApprovalState);
  rpc ConsumeApproval(ConsumeApprovalRequest) returns (ApprovalResponse);
}
