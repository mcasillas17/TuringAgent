syntax = "proto3";

package turing.v1;

option go_package = "github.com/mcasillas17/TuringAgent/gen/turing/v1/go;turingv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum AgentId {
  AGENT_ID_UNSPECIFIED = 0;
  AGENT_ID_GENERAL_ASSISTANT = 1;
}

enum ModelProvider {
  MODEL_PROVIDER_UNSPECIFIED = 0;
  MODEL_PROVIDER_OLLAMA = 1;
  MODEL_PROVIDER_OPENAI_COMPATIBLE = 2;
}

enum EgressDataCategory {
  EGRESS_DATA_CATEGORY_UNSPECIFIED = 0;
  EGRESS_DATA_CATEGORY_CURRENT_MESSAGE = 1;
  EGRESS_DATA_CATEGORY_CONVERSATION_HISTORY = 2;
  EGRESS_DATA_CATEGORY_CROSS_SESSION_RECALL = 3;
  EGRESS_DATA_CATEGORY_MEMORY_PROFILE = 4;
  EGRESS_DATA_CATEGORY_SKILL_CONTENT = 5;
  EGRESS_DATA_CATEGORY_TOOL_SCHEMAS = 6;
  EGRESS_DATA_CATEGORY_TOOL_ARGUMENTS = 7;
  EGRESS_DATA_CATEGORY_TOOL_RESULTS = 8;
  EGRESS_DATA_CATEGORY_ATTACHMENTS = 9;
}

enum RoutingRequirementKind {
  ROUTING_REQUIREMENT_KIND_UNSPECIFIED = 0;
  ROUTING_REQUIREMENT_KIND_PROVIDER = 1;
  ROUTING_REQUIREMENT_KIND_MODEL = 2;
  ROUTING_REQUIREMENT_KIND_CONTEXT = 3;
  ROUTING_REQUIREMENT_KIND_TOOL = 4;
  ROUTING_REQUIREMENT_KIND_AGENT = 5;
  ROUTING_REQUIREMENT_KIND_CAPACITY = 6;
  ROUTING_REQUIREMENT_KIND_EXTERNAL_AGENT_CREDENTIAL = 7;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
  MESSAGE_ROLE_TOOL = 4;
}

enum ToolPolicy {
  TOOL_POLICY_UNSPECIFIED = 0;
  TOOL_POLICY_SAFE = 1;
  TOOL_POLICY_APPROVAL_REQUIRED = 2;
  TOOL_POLICY_DISABLED = 3;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_WAITING_APPROVAL = 3;
  RUN_STATUS_COMPLETED = 4;
  RUN_STATUS_FAILED = 5;
  RUN_STATUS_CANCELLED = 6;
}

message RequestMetadata {
  string request_id = 1;
}

message PageRequest {
  int32 limit = 1;
  string cursor = 2;
}

message PageResponse {
  string next_cursor = 1;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  string request_id = 3;
  google.protobuf.Struct details = 4;
}

message RoutingUnavailableDetail {
  RoutingRequirementKind kind = 1;
  string requested = 2;
  repeated string available = 3;
}

message ModelCapability {
  ModelProvider provider = 1;
  string model = 2;
  // An operator-configured routing guarantee, not a value inferred from a
  // provider label or model name.
  int32 max_context_tokens = 3;
}

message ProviderConfig {
  ModelProvider provider = 1;
  bool enabled = 2;
  string default_model = 3;
  repeated ModelCapability models = 4;
  // Canonical provider base endpoint. Empty for local providers.
  string remote_endpoint = 5;
  bool requires_per_run_consent = 6;
}

message RemoteEgressDisclosure {
  string challenge = 1;
  ModelProvider provider = 2;
  string model = 3;
  string endpoint = 4;
  string endpoint_host = 5;
  string external_agent_id = 6;
  repeated EgressDataCategory data_categories = 7;
  google.protobuf.Timestamp expires_at = 8;
  repeated RemoteMcpEgressDestination remote_mcp_servers = 9;
  repeated string selected_tools = 10;
  repeated IntegrationEgressDestination integration_endpoints = 11;
  repeated SkillEgressDisclosure skills = 12;
}

message SkillEgressDisclosure {
  string skill_id = 1;
  string display_name = 2;
  bool body_may_be_sent = 3;
}

message RemoteMcpEgressDestination {
  string server_name = 1;
  string endpoint = 2;
  string endpoint_host = 3;
}

message IntegrationEgressDestination {
  string endpoint = 1;
  string endpoint_host = 2;
  string connection_id = 3;
  string display_name = 4;
  repeated string tools = 5;
}

message RemoteEgressConsent {
  string challenge = 1;
  repeated EgressDataCategory acknowledged_data_categories = 2;
  bool acknowledged = 3;
}

// The orchestrator-owned decision frozen for one remote run. It contains no
// challenge, nonce, credential value/reference, or request content; one-way
// digests bind those inputs without disclosing them.
message RunEgressDecision {
  string decision_id = 1;
  int32 version = 2;
  ModelProvider provider = 3;
  string model = 4;
  string endpoint = 5;
  string endpoint_host = 6;
  string external_agent_id = 7;
  repeated EgressDataCategory data_categories = 8;
  google.protobuf.Timestamp consent_granted_at = 9;
  string challenge_fingerprint = 10;
  repeated string selected_tools = 11;
  string skill_snapshot_fingerprint = 12;
  bool recall_applicable = 13;
  bool memory_profile_applicable = 14;
  string external_credential_ref_hash = 15;
  string request_digest = 16;
  repeated RemoteMcpEgressDestination remote_mcp_servers = 17;
  repeated IntegrationEgressDestination integration_endpoints = 18;
}

message AgentDescriptor {
  AgentId id = 1;
  string display_name = 2;
  bool available = 3;
}

message Message {
  string message_id = 1;
  string session_id = 2;
  string run_id = 3;
  MessageRole role = 4;
  string content = 5;
  string content_type = 6;
  int64 sequence = 7;
  google.protobuf.Timestamp created_at = 8;
}
