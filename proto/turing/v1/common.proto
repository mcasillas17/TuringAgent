syntax = "proto3";

package turing.v1;

option go_package = "github.com/mcasillas17/TuringAgent/gen/turing/v1/go;turingv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum AgentId {
  AGENT_ID_UNSPECIFIED = 0;
  AGENT_ID_GENERAL_ASSISTANT = 1;
}

enum ModelProvider {
  MODEL_PROVIDER_UNSPECIFIED = 0;
  MODEL_PROVIDER_OLLAMA = 1;
  MODEL_PROVIDER_OPENAI_COMPATIBLE = 2;
}

enum EgressDataCategory {
  EGRESS_DATA_CATEGORY_UNSPECIFIED = 0;
  EGRESS_DATA_CATEGORY_CURRENT_MESSAGE = 1;
  EGRESS_DATA_CATEGORY_CONVERSATION_HISTORY = 2;
  EGRESS_DATA_CATEGORY_CROSS_SESSION_RECALL = 3;
  EGRESS_DATA_CATEGORY_MEMORY_PROFILE = 4;
  EGRESS_DATA_CATEGORY_SKILL_CONTENT = 5;
  EGRESS_DATA_CATEGORY_TOOL_SCHEMAS = 6;
  EGRESS_DATA_CATEGORY_TOOL_ARGUMENTS = 7;
  EGRESS_DATA_CATEGORY_TOOL_RESULTS = 8;
  EGRESS_DATA_CATEGORY_ATTACHMENTS = 9;
}

// The vault's shelves. A tier is the unit a user turns on or off, so the
// disclosure and the settings surface name the same vocabulary.
enum MemoryTier {
  MEMORY_TIER_UNSPECIFIED = 0;
  MEMORY_TIER_PERSONA = 1;
  MEMORY_TIER_PROFILE = 2;
  MEMORY_TIER_BELIEF = 3;
  MEMORY_TIER_NOTE = 4;
}

enum RoutingRequirementKind {
  ROUTING_REQUIREMENT_KIND_UNSPECIFIED = 0;
  ROUTING_REQUIREMENT_KIND_PROVIDER = 1;
  ROUTING_REQUIREMENT_KIND_MODEL = 2;
  ROUTING_REQUIREMENT_KIND_CONTEXT = 3;
  ROUTING_REQUIREMENT_KIND_TOOL = 4;
  ROUTING_REQUIREMENT_KIND_AGENT = 5;
  ROUTING_REQUIREMENT_KIND_CAPACITY = 6;
  ROUTING_REQUIREMENT_KIND_EXTERNAL_AGENT_CREDENTIAL = 7;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
  MESSAGE_ROLE_TOOL = 4;
}

enum ToolPolicy {
  TOOL_POLICY_UNSPECIFIED = 0;
  TOOL_POLICY_SAFE = 1;
  TOOL_POLICY_APPROVAL_REQUIRED = 2;
  TOOL_POLICY_DISABLED = 3;
}

// Legacy run status. Superseded for durable public outcome snapshots by
// RunLifecycle, which adds recovering plus explicit unspecified/unknown
// handling. Retained and unrenumbered: existing clients and stored payloads
// still read these numbers.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_WAITING_APPROVAL = 3;
  RUN_STATUS_COMPLETED = 4;
  RUN_STATUS_FAILED = 5;
  RUN_STATUS_CANCELLED = 6;
}

// The authoritative public phase of a run. UNSPECIFIED means the field was
// absent on the wire and UNKNOWN stands for a phase a newer server introduced
// that this reader cannot name, so neither is ever treated as a real phase;
// TUR-009 itself never persists or emits UNKNOWN. Terminal phases (completed,
// failed, cancelled) are immutable. Recovering is durable and observable: while
// worker ownership is uncertain, both reopen and live streaming show recovering
// rather than running.
enum RunLifecycle {
  RUN_LIFECYCLE_UNSPECIFIED = 0;
  RUN_LIFECYCLE_UNKNOWN = 1;
  RUN_LIFECYCLE_QUEUED = 2;
  RUN_LIFECYCLE_RUNNING = 3;
  RUN_LIFECYCLE_WAITING_APPROVAL = 4;
  RUN_LIFECYCLE_RECOVERING = 5;
  RUN_LIFECYCLE_COMPLETED = 6;
  RUN_LIFECYCLE_FAILED = 7;
  RUN_LIFECYCLE_CANCELLED = 8;
}

// Why a run reached its terminal lifecycle, as a closed vocabulary a client can
// localize instead of rendering server prose. NONE is the reason every
// nonterminal phase carries, and also a completed run that produced displayable
// content; COMPLETED_NO_CONTENT is a success that produced none. Which reasons
// are legal for which lifecycle is fixed by the normative matrix in the design:
// cancelled allows only USER_CANCELLED or ABANDONED, failed allows the failure
// reasons, and LEGACY_UNKNOWN marks a pre-migration row whose real reason was
// never recorded.
enum RunOutcomeReason {
  RUN_OUTCOME_REASON_UNSPECIFIED = 0;
  RUN_OUTCOME_REASON_UNKNOWN = 1;
  RUN_OUTCOME_REASON_NONE = 2;
  RUN_OUTCOME_REASON_COMPLETED_NO_CONTENT = 3;
  RUN_OUTCOME_REASON_USER_CANCELLED = 4;
  RUN_OUTCOME_REASON_ABANDONED = 5;
  RUN_OUTCOME_REASON_EXPIRED = 6;
  RUN_OUTCOME_REASON_CONTEXT_LIMIT = 7;
  RUN_OUTCOME_REASON_PROVIDER_FAILURE = 8;
  RUN_OUTCOME_REASON_TOOL_FAILURE = 9;
  RUN_OUTCOME_REASON_POLICY_DENIED = 10;
  RUN_OUTCOME_REASON_RETRIES_EXHAUSTED = 11;
  RUN_OUTCOME_REASON_RECOVERY_INTERRUPTED = 12;
  RUN_OUTCOME_REASON_SIDE_EFFECT_UNCERTAIN = 13;
  RUN_OUTCOME_REASON_APPROVAL_DELIVERY_FAILED = 14;
  RUN_OUTCOME_REASON_INTERNAL_FAILURE = 15;
  RUN_OUTCOME_REASON_LEGACY_UNKNOWN = 16;
}

// The durable, self-contained answer to "what happened to this run", carried on
// history and on every lifecycle event so a reopened session and a live stream
// agree without replaying the timeline.
//
// There is deliberately no retryable field: whether the system retries is an
// internal dispatch decision, not a promise that repeating the request is safe.
message RunState {
  string run_id = 1;
  string user_message_id = 2;
  string assistant_message_id = 3;
  RunLifecycle lifecycle = 4;
  RunOutcomeReason outcome_reason = 5;
  // Per-run monotonic version, starting at 1, incremented exactly once per real
  // public transition. Semantic no-ops do not increment it. It is the only
  // ordering authority for reconciliation: a client keeps the higher version
  // and drops anything older, so out-of-order or duplicate delivery cannot
  // resurrect a stale phase. Zero means absent, never "version zero".
  int64 state_version = 6;
  // Required on every published snapshot: the durable, public record of when
  // this version was recorded. A publisher that cannot vouch for this value —
  // because it is absent or fails to parse — omits the whole snapshot rather
  // than send a RunState without it, so a client that receives this message
  // can always rely on this field being set.
  google.protobuf.Timestamp state_updated_at = 7;
  // Set only for terminal lifecycles.
  google.protobuf.Timestamp finished_at = 8;
  // Whether the canonical assistant message has content worth rendering, so a
  // client can distinguish a silent success from a lost one without inspecting
  // message bodies.
  bool has_displayable_content = 9;
}

message RequestMetadata {
  string request_id = 1;
}

message PageRequest {
  int32 limit = 1;
  string cursor = 2;
}

message PageResponse {
  string next_cursor = 1;
}

message ErrorDetail {
  string code = 1;
  string message = 2;
  string request_id = 3;
  google.protobuf.Struct details = 4;
}

message RoutingUnavailableDetail {
  RoutingRequirementKind kind = 1;
  string requested = 2;
  repeated string available = 3;
}

message ModelCapability {
  ModelProvider provider = 1;
  string model = 2;
  // An operator-configured routing guarantee, not a value inferred from a
  // provider label or model name.
  int32 max_context_tokens = 3;
}

message ProviderConfig {
  ModelProvider provider = 1;
  bool enabled = 2;
  string default_model = 3;
  repeated ModelCapability models = 4;
  // Canonical provider base endpoint. Empty for local providers.
  string remote_endpoint = 5;
  bool requires_per_run_consent = 6;
}

message RemoteEgressDisclosure {
  string challenge = 1;
  ModelProvider provider = 2;
  string model = 3;
  string endpoint = 4;
  string endpoint_host = 5;
  string external_agent_id = 6;
  repeated EgressDataCategory data_categories = 7;
  google.protobuf.Timestamp expires_at = 8;
  repeated RemoteMcpEgressDestination remote_mcp_servers = 9;
  repeated string selected_tools = 10;
  repeated IntegrationEgressDestination integration_endpoints = 11;
  repeated SkillEgressDisclosure skills = 12;
  // Memory that would leave the machine, named note by note. The disclosure is
  // what the user reads before consenting, so it carries titles and vault
  // paths and never the signed snapshot fingerprint the run-owned decision
  // uses internally.
  repeated MemoryEgressDisclosure memory_notes = 13;
  bool memory_profile_may_be_sent = 14;
  // Per-category expansion of data_categories. The bare enum list cannot say
  // *what* would be sent, so a client cannot honestly render the consent
  // prompt from it alone.
  repeated EgressDataCategoryDetail data_category_details = 15;
}

message MemoryEgressDisclosure {
  string note_id = 1;
  string title = 2;
  string vault_path = 3;
  MemoryTier tier = 4;
  bool body_may_be_sent = 5;
}

message EgressDataCategoryDetail {
  EgressDataCategory category = 1;
  string summary = 2;
  repeated string items = 3;
  // Kept separate from items so a bounded/truncated list can still report the
  // true total rather than understating what is being sent.
  int32 item_count = 4;
}

message SkillEgressDisclosure {
  string skill_id = 1;
  string display_name = 2;
  bool body_may_be_sent = 3;
}

message RemoteMcpEgressDestination {
  string server_name = 1;
  string endpoint = 2;
  string endpoint_host = 3;
}

message IntegrationEgressDestination {
  string endpoint = 1;
  string endpoint_host = 2;
  string connection_id = 3;
  string display_name = 4;
  repeated string tools = 5;
}

message RemoteEgressConsent {
  string challenge = 1;
  repeated EgressDataCategory acknowledged_data_categories = 2;
  bool acknowledged = 3;
}

// The orchestrator-owned decision frozen for one remote run. It contains no
// challenge, nonce, credential value/reference, or request content; one-way
// digests bind those inputs without disclosing them.
message RunEgressDecision {
  string decision_id = 1;
  int32 version = 2;
  ModelProvider provider = 3;
  string model = 4;
  string endpoint = 5;
  string endpoint_host = 6;
  string external_agent_id = 7;
  repeated EgressDataCategory data_categories = 8;
  google.protobuf.Timestamp consent_granted_at = 9;
  string challenge_fingerprint = 10;
  repeated string selected_tools = 11;
  string skill_snapshot_fingerprint = 12;
  bool recall_applicable = 13;
  bool memory_profile_applicable = 14;
  string external_credential_ref_hash = 15;
  string request_digest = 16;
  repeated RemoteMcpEgressDestination remote_mcp_servers = 17;
  repeated IntegrationEgressDestination integration_endpoints = 18;
  // Binds the run to the exact memory snapshot the user consented to. Run-owned
  // and internal: it is never surfaced on a public or audit response.
  string memory_snapshot_fingerprint = 19;
}

message AgentDescriptor {
  AgentId id = 1;
  string display_name = 2;
  bool available = 3;
}

message Message {
  string message_id = 1;
  string session_id = 2;
  string run_id = 3;
  MessageRole role = 4;
  string content = 5;
  string content_type = 6;
  int64 sequence = 7;
  google.protobuf.Timestamp created_at = 8;
  // The authoritative state of the run that produced this message, so reopened
  // history needs no separate query to know the outcome. Absent when the
  // message has no run correlation, or when legacy correlation is inconsistent.
  RunState run_state = 9;
}
