syntax = "proto3";

package turing.v1;

option go_package = "github.com/mcasillas17/TuringAgent/gen/turing/v1/go;turingv1";

// A SKILL.md file and the user's decisions about whether it may load.
// Metadata and body come from disk on every read; only enabled and capability
// grants are persisted in SQLite.
message Skill {
  string skill_id = 1;
  string name = 2;
  string description = 3;
  string body = 4;
  string category = 5;
  string version = 6;
  string author = 7;
  string license = 8;
  repeated string requires = 9;
  repeated string granted_capabilities = 10;
  repeated string missing_capabilities = 11;
  bool enabled = 12;
  string parse_error = 13;
  string folder_path = 14;
}

message ListSkillsRequest {}

message ListSkillsResponse {
  repeated Skill skills = 1;
}

message GetSkillRequest {
  string skill_id = 1;
}

message SetSkillEnabledRequest {
  string skill_id = 1;
  bool enabled = 2;
}

message SetSkillCapabilityGrantRequest {
  string skill_id = 1;
  string capability = 2;
  bool granted = 3;
}

service SkillService {
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc GetSkill(GetSkillRequest) returns (Skill);
  rpc SetSkillEnabled(SetSkillEnabledRequest) returns (Skill);
  rpc SetSkillCapabilityGrant(SetSkillCapabilityGrantRequest) returns (Skill);
}
