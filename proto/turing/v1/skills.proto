syntax = "proto3";

package turing.v1;

option go_package = "github.com/mcasillas17/TuringAgent/gen/turing/v1/go;turingv1";

import "google/protobuf/timestamp.proto";

// A named block of instructions the user writes once and attaches to the
// conversations where it applies.
//
// Skills are explicit, not inferred: the agent never decides which ones are
// relevant. What is attached to a conversation is exactly what was attached by
// hand, which is what makes a change in behaviour traceable to a specific
// skill rather than to a selection step nobody can see.
message Skill {
  string skill_id = 1;
  string name = 2;
  string instructions = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateSkillRequest {
  string name = 1;
  string instructions = 2;
}

message UpdateSkillRequest {
  string skill_id = 1;
  string name = 2;
  string instructions = 3;
}

message DeleteSkillRequest {
  string skill_id = 1;
}

message DeleteSkillResponse {}

message ListSkillsRequest {}

message ListSkillsResponse {
  repeated Skill skills = 1;
}

message AttachSkillRequest {
  string session_id = 1;
  string skill_id = 2;
}

message DetachSkillRequest {
  string session_id = 1;
  string skill_id = 2;
}

message SessionSkillsResponse {
  repeated Skill skills = 1;
}

message ListSessionSkillsRequest {
  string session_id = 1;
}

service SkillService {
  rpc CreateSkill(CreateSkillRequest) returns (Skill);
  rpc UpdateSkill(UpdateSkillRequest) returns (Skill);
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);

  // Attach and detach return the conversation's full skill set so a client
  // never has to guess what the server now believes is attached.
  rpc AttachSkill(AttachSkillRequest) returns (SessionSkillsResponse);
  rpc DetachSkill(DetachSkillRequest) returns (SessionSkillsResponse);
  rpc ListSessionSkills(ListSessionSkillsRequest) returns (SessionSkillsResponse);
}
